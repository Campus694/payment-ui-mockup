<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParityPay — Grand Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(1200px 600px at 50% -10%, #1d1d1d 0%, #161616 55%) fixed;
      color: #ffffff;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 18px 32px;
      position: relative;
      overflow-x: hidden;
    }

    .wrapper {
      width: 100%;
      max-width: 484px;
    }

    .hidden { display: none !important; }

    /* Шапка */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-top: 2px;
    }

    .logo {
      display: block;
      width: 110px;
      height: auto;
      user-select: none;
    }

    .lang-group {
      display: flex;
      gap: 6px;
      background: #1c1c1c;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
    }

    .lang-btn {
      width: 42px;
      height: 30px;
      border-radius: 7px;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.18s ease, color 0.18s ease;
    }

    .lang-btn.active {
      background-color: #363636;
      color: #ffffff;
    }

    .lang-btn.inactive {
      background-color: transparent;
      color: #8f8f8f;
    }

    .lang-btn.inactive:hover { color: #c5c5c5; }

    /* Основная карточка */
    .card {
      background: linear-gradient(180deg, #242424 0%, #1f1f1f 100%);
      border: 1px solid #2c2c2c;
      border-radius: 16px;
      padding: 28px 22px 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .merchant-title {
      font-size: 29px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.1px;
      margin-bottom: 11px;
      line-height: 1.15;
    }

    .order-id-row {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #8c8c8c;
      font-size: 14px;
      font-weight: 400;
      margin-bottom: 30px;
      line-height: 1.2;
      word-break: break-all;
    }

    .copy-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      color: #8c8c8c;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.15s ease;
    }

    .copy-btn:hover { color: #c5c5c5; }
    .copy-btn.copied { color: #4caf7a; }

    .amount {
      font-size: 42px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.05;
      margin-bottom: 12px;
      letter-spacing: 0.2px;
      display: flex;
      align-items: baseline;
      gap: 0.14em;
    }

    .commission {
      font-size: 15px;
      color: #8c8c8c;
      font-weight: 400;
      margin-bottom: 32px;
      display: flex;
      align-items: baseline;
      gap: 0.2em;
    }

    /* Символ валюты */
    .rub {
      display: inline-block;
      width: 0.62em;
      height: 0.72em;
      fill: currentColor;
      flex-shrink: 0;
      align-self: baseline;
    }

    .commission .rub {
      width: 0.6em;
      height: 0.68em;
    }

    .method-heading {
      font-size: 21px;
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 20px;
      letter-spacing: 0.1px;
    }

    .methods-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .method-box {
      width: 100%;
      background-color: #262626;
      border: 1px solid #343434;
      border-radius: 14px;
      padding: 20px 22px;
      display: flex;
      align-items: center;
      gap: 22px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      color: inherit;
      transition: border-color 0.18s ease, background-color 0.18s ease, transform 0.15s ease;
    }

    .method-box:hover {
      background-color: #2b2b2b;
      border-color: #4a4a4a;
    }

    .method-box:active { transform: scale(0.995); }

    .method-icon {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      display: block;
      color: #cfcfcf;
    }

    .method-label {
      font-size: 17px;
      font-weight: 500;
      color: #ececec;
      line-height: 1.4;
    }

    /* Экран реквизитов: кнопка прижата к низу (только в режиме формы) */
    #screenCard.form-mode > .card {
      min-height: calc(100vh - 150px);
      display: flex;
      flex-direction: column;
    }

    #cardForm {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card-sub {
      font-size: 15px;
      color: #8c8c8c;
      margin-bottom: 20px;
      display: flex;
      align-items: baseline;
      gap: 0.2em;
    }

    .req-list {
      border-top: 1px solid #2f2f2f;
    }

    .req-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid #2f2f2f;
    }

    .req-label {
      font-size: 13px;
      color: #8c8c8c;
      margin-bottom: 5px;
    }

    .req-value {
      font-size: 16.5px;
      font-weight: 500;
      color: #ffffff;
      word-break: break-all;
    }

    .pay-btn {
      width: 100%;
      height: 54px;
      margin-top: auto;
      border: none;
      border-radius: 12px;
      background-color: #DF5A28;
      color: #ffffff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 6px 18px rgba(223, 90, 40, 0.25);
    }

    .pay-btn:hover { background-color: #ea7442; }
    .pay-btn:active { transform: scale(0.99); }

    /* Экран ожидания проверки / успех (компактный) */
    .pending {
      text-align: center;
      padding: 20px 0 8px;
    }

    .status-icon {
      position: relative;
      width: 72px;
      height: 64px;
      margin: 0 auto 18px;
    }

    .status-icon .warn {
      width: 72px;
      height: 64px;
      display: block;
    }

    .status-spinner {
      position: absolute;
      right: -10px;
      bottom: -8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: #1f1f1f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-spinner .ring {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid #3c3c3c;
      border-top-color: #DF5A28;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .pending-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: #DF5A28;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    .pending-note {
      font-size: 13px;
      color: #8c8c8c;
      line-height: 1.45;
      max-width: 280px;
      margin: 0 auto;
    }

    /* Успех: круглая галочка */
    .success-wrap {
      padding: 36px 0 12px;
      text-align: center;
    }

    .success-circle {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #5fd28b, #3ba86b 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 28px rgba(76, 175, 122, 0.35);
      animation: popIn 0.4s ease-out;
    }

    .success-circle svg {
      width: 46px;
      height: 46px;
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      70% { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .success-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.2px;
    }

    /* Оверлей и панель подтверждения */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 40;
    }

    .sheet-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 484px;
      margin: 0 auto;
      background-color: #212121;
      border-radius: 18px 18px 0 0;
      border-top: 1px solid #2c2c2c;
      padding: 22px 20px 32px;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      z-index: 50;
    }

    .sheet.open {
      transform: translateY(0);
    }

    .sheet-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .slider {
      position: relative;
      width: 100%;
      height: 60px;
      background-color: #262626;
      border: 1px solid #383838;
      border-radius: 14px;
      overflow: hidden;
      user-select: none;
    }

    .slider-handle {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 52px;
      height: 50px;
      border-radius: 11px;
      background-color: #DF5A28;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      z-index: 2;
      box-shadow: 0 4px 14px rgba(223, 90, 40, 0.35);
    }

    .slider-handle:active { cursor: grabbing; }

    /* Плавающая кнопка поддержки */
    .chat-fab {
      position: fixed;
      right: 32px;
      bottom: 21px;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background-color: #DF5A28;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      transition: transform 0.15s ease, background-color 0.15s ease;
      text-decoration: none;
      z-index: 30;
    }

    .chat-fab:hover { background-color: #ea7442; }
    .chat-fab:active { transform: scale(0.96); }

    /* Скелетон */
    .skeleton {
      display: inline-block;
      border-radius: 8px;
      background: linear-gradient(100deg, #232323 40%, #343434 50%, #232323 60%);
      background-size: 200% 100%;
      animation: shimmer 1.4s linear infinite;
      vertical-align: middle;
      user-select: none;
    }

    .skel-title  { width: 190px; height: 30px; border-radius: 6px; }
    .skel-id     { width: 150px; height: 15px; border-radius: 5px; }
    .skel-amount { width: 170px; height: 42px; border-radius: 10px; }
    .skel-line   { width: 130px; height: 17px; border-radius: 5px; }

    @keyframes shimmer {
      to { background-position: -200% 0; }
    }

    .retry-btn {
      background: none;
      border: 1px solid #4a4a4a;
      border-radius: 6px;
      color: #DF5A28;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .retry-btn:hover { border-color: #DF5A28; background-color: rgba(223, 90, 40, 0.08); }

    @media (max-width: 420px) {
      .order-id-row { font-size: 12.8px; }
      .method-box { padding: 18px 18px; gap: 20px; }
      .method-label { font-size: 16px; }
      .chat-fab { right: 18px; }
    }
  </style>
</head>
<body>

  <!-- Символ рубля -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="rub" viewBox="0 0 601 657">
      <rect x="105" y="0" width="88" height="657"/>
      <rect x="105" y="0" width="427" height="78"/>
      <path d="M193 280 H365 C500 280 601 345 601 465 C601 575 520 657 365 657 H193 V582 H365 C450 582 508 545 508 465 C508 375 450 355 365 355 H193 Z"/>
      <rect x="0" y="438" width="347" height="61"/>
    </symbol>
  </svg>

  <div class="wrapper">
    <!-- Шапка -->
    <header class="header">
      <svg class="logo" viewBox="0 0 132 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M68.5 4C68.5 4 57.5 8.2 57.5 16.5C57.5 20.8 60.8 23.5 64.5 23.5C68.5 23.5 68.5 18 68.5 12V4Z" fill="#DF5A28"/>
        <path d="M3 41V24.5C3 21.8 4.8 20 7.5 20H14.5C17.5 20 19.5 21.8 19.5 25V29C19.5 32.2 17.5 34 14.5 34H5.5" stroke="#EAEAEA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M25.5 20.5H34.5C37.2 20.5 38.8 22 38.8 24.8V34H28.5C25.8 34 24.2 32.6 24.2 30.2C24.2 27.8 25.8 26.5 28.5 26.5H38.5" stroke="#EAEAEA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M45 34V24.5C45 21.8 46.8 20.5 49.5 20.5H54" stroke="#EAEAEA" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M61 20.5V31.2C61 33 62.2 34 64.2 34H67.5" stroke="#DF5A28" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M74 15.5V31C74 33 75.3 34 77.5 34H81.5M70.5 20.8H80.5" stroke="#EAEAEA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M86.5 20.5V29.8C86.5 32.4 88.2 34 91 34H99.5M99.5 20.5V37.5C99.5 40 97.8 41.5 94.8 41.5H88" stroke="#EAEAEA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <g transform="translate(0 8)">
          <path d="M72.5 57.5V43.5C72.5 41.2 74.2 39.8 76.5 39.8H83C85.5 39.8 87.2 41.2 87.2 43.8V47.5C87.2 50 85.5 51.5 83 51.5H74.5" stroke="#EAEAEA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M93.5 39.8H101.5C104 39.8 105.5 41.2 105.5 43.8V51.5H96C93.5 51.5 92 50.2 92 48.2C92 46.2 93.5 45 96 45H105.2" stroke="#EAEAEA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M111.5 39.8V47.8C111.5 50.2 113 51.5 115.5 51.5H123.5M123.5 39.8V54.5C123.5 56.8 122 58 119.2 58H113" stroke="#EAEAEA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>

      <div class="lang-group">
        <button class="lang-btn active" type="button" data-lang="ru">RU</button>
        <button class="lang-btn inactive" type="button" data-lang="en">EN</button>
      </div>
    </header>

    <!-- Экран 1: выбор метода -->
    <div id="screenMain">
      <main class="card">
        <h1 class="merchant-title" id="merchantTitle">Grand Market</h1>

        <div class="order-id-row">
          <span id="orderIdText"></span>
          <button class="copy-btn" id="copyBtn" type="button">
            <svg width="16" height="18" viewBox="0 0 16 18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M11.5 1H3C2.17 1 1.5 1.67 1.5 2.5V13H3V2.5H11.5V1ZM14 4H5.5C4.67 4 4 4.67 4 5.5V15.5C4 16.33 4.67 17 5.5 17H14C14.83 17 15.5 16.33 15.5 15.5V5.5C15.5 4.67 14.83 4 14 4ZM14 15.5H5.5V5.5H14V15.5Z" fill="currentColor"/>
            </svg>
          </button>
        </div>

        <div class="amount">
          <span id="amountMain"></span>
          <svg class="rub" viewBox="0 0 601 657" aria-label="₽"><use href="#rub"/></svg>
        </div>
        <div class="commission">
          <span data-i18n="commission">Комиссия: 0</span>
          <svg class="rub" viewBox="0 0 601 657" aria-label="₽"><use href="#rub"/></svg>
        </div>

        <h2 class="method-heading" data-i18n="chooseMethod">Выберите метод</h2>

        <div class="methods-list">
          <button class="method-box" type="button" id="cardMethod">
            <svg class="method-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="5" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/>
              <path d="M2 10H22" stroke="currentColor" stroke-width="1.8"/>
              <path d="M6 15H10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span class="method-label" data-i18n="byCard">Банковской картой</span>
          </button>
        </div>
      </main>
    </div>

    <!-- Экран 2: перевод по реквизитам -->
    <div id="screenCard" class="hidden">
      <main class="card">
        <div id="cardForm">
          <h2 class="card-title" data-i18n="cardTitle">Перевод по реквизитам</h2>
          <div class="card-sub">
            <span data-i18n="toPay">К оплате:</span> <span id="subAmount"></span>
            <svg class="rub" viewBox="0 0 601 657" aria-label="₽"><use href="#rub"/></svg>
          </div>

          <div class="req-list">
            <div class="req-row">
              <div>
                <div class="req-label" data-i18n="reqBank">Банк</div>
                <div class="req-value" id="reqBank"></div>
              </div>
              <button class="copy-btn" type="button" data-copy="reqBank" aria-label="Copy">
                <svg width="16" height="18" viewBox="0 0 16 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M11.5 1H3C2.17 1 1.5 1.67 1.5 2.5V13H3V2.5H11.5V1ZM14 4H5.5C4.67 4 4 4.67 4 5.5V15.5C4 16.33 4.67 17 5.5 17H14C14.83 17 15.5 16.33 15.5 15.5V5.5C15.5 4.67 14.83 4 14 4ZM14 15.5H5.5V5.5H14V15.5Z" fill="currentColor"/>
                </svg>
              </button>
            </div>

            <div class="req-row">
              <div>
                <div class="req-label" data-i18n="reqAccount">Номер карты / счёта</div>
                <div class="req-value" id="reqAccount"></div>
              </div>
              <button class="copy-btn" type="button" data-copy="reqAccount" aria-label="Copy">
                <svg width="16" height="18" viewBox="0 0 16 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M11.5 1H3C2.17 1 1.5 1.67 1.5 2.5V13H3V2.5H11.5V1ZM14 4H5.5C4.67 4 4 4.67 4 5.5V15.5C4 16.33 4.67 17 5.5 17H14C14.83 17 15.5 16.33 15.5 15.5V5.5C15.5 4.67 14.83 4 14 4ZM14 15.5H5.5V5.5H14V15.5Z" fill="currentColor"/>
                </svg>
              </button>
            </div>

            <div class="req-row">
              <div>
                <div class="req-label" data-i18n="reqAmount">Сумма</div>
                <div class="req-value" id="reqAmount"></div>
              </div>
              <button class="copy-btn" type="button" data-copy="reqAmount" aria-label="Copy">
                <svg width="16" height="18" viewBox="0 0 16 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M11.5 1H3C2.17 1 1.5 1.67 1.5 2.5V13H3V2.5H11.5V1ZM14 4H5.5C4.67 4 4 4.67 4 5.5V15.5C4 16.33 4.67 17 5.5 17H14C14.83 17 15.5 16.33 15.5 15.5V5.5C15.5 4.67 14.83 4 14 4ZM14 15.5H5.5V5.5H14V15.5Z" fill="currentColor"/>
                </svg>
              </button>
            </div>
          </div>

          <button class="pay-btn" type="button" id="payBtn">
            <span data-i18n="payBtn">Проверить платёж</span>
          </button>
        </div>

        <!-- Экран ожидания проверки -->
        <div id="cardSuccess" class="pending hidden">
          <div class="status-icon">
            <svg class="warn" viewBox="0 0 64 56" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M32 5 L60 50 Q63 55 57 55 H7 Q1 55 4 50 Z" fill="#F3C623" stroke="#F3C623" stroke-width="4" stroke-linejoin="round"/>
              <rect x="29.5" y="20" width="5" height="19" rx="2.5" fill="#161616"/>
              <circle cx="32" cy="45" r="2.8" fill="#161616"/>
            </svg>
            <div class="status-spinner">
              <div class="ring"></div>
            </div>
          </div>
          <div class="pending-title">
            <span data-i18n="pendingTitle">Обработка</span>
            <div class="dots"><span></span><span></span><span></span></div>
          </div>
          <p class="pending-note" data-i18n="pendingNote">Проверка занимает<br>до 2 минут, ожидайте.</p>


        </div>

        <!-- Экран успеха -->
        <div id="cardDone" class="success-wrap hidden">
          <div class="success-circle">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 12.5L10 17.5L19 7" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="success-title" data-i18n="successTitle">Успешно!</div>
        </div>
      </main>
    </div>
  </div>

  <!-- Оверлей и панель подтверждения -->
  <div class="sheet-overlay" id="sheetOverlay"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-title" data-i18n="sheetTitle">Подтвердите перевод</div>

    <div class="slider" id="slider">
      <div class="slider-handle" id="sliderHandle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M5 12H19M13 6L19 12L13 18" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Кнопка поддержки -->
  <a class="chat-fab" id="chatFab" href="#" target="_blank" rel="noopener" aria-label="Support">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M20 4H4C2.9 4 2 4.9 2 6V20L6 16H20C21.1 16 22 15.1 22 14V6C22 4.9 21.1 4 20 4ZM18 11H6V9.5H18V11ZM18 8H6V6.5H18V8Z" fill="#FFFFFF"/>
    </svg>
  </a>

  <script src="/payment-ui-mockup/app.js"></script>
</body>
</html>
